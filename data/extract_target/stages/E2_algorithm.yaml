stage: E2_algorithm
order: 2
enabled: true
target:
  classes:
  - Algorithm
  - AlgorithmModule
  wrapper: null
  target_desc: Algorithm + AlgorithmModule
contract:
  required:
  - name
  - mechanism
  optional:
  - task_type
  - problems_solved
  - why_it_works
  - applicable_to
  - limitations
  - modules
  note: code_symbols 只能从【代码符号清单】选；flow_family 由规则判定。
  all_fields:
  - name
  - task_type
  - mechanism
  - limitations
  - modules
  - arch_modules
  - key_challenge
  - why_not_other
section_slice: algorithm
slots:
- code_symbols
- paper_text
template: '【论文标题】{title}

  【方法相关正文】

  {paper_text}


  任务：抽取本文提出的核心算法。只输出 JSON：

  {"algorithms":[{"name":"算法名","task_type":"从词表选","mechanism":"核心机理（≤200字）","limitations":["局限"],"modules":[{"name":"模块名","mechanism":"机理","inputs":"输入","outputs":"输出"}],"arch_modules":[{"name":"系统级模块名","role":"职责","input":"输入","output":"输出"}],"key_challenge":"作者指出的核心技术挑战","why_not_other":"为何不用同流派其他做法（原文没有则空串）"}]}

  只输出JSON，不要解释。'
