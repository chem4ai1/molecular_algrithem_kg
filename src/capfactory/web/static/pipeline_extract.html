<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CapFactory · 论文抽取</title>
<link rel="stylesheet" href="/static/app.css" />
<style>
  main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;
       max-width:1560px;height:calc(100vh - 92px)}
  @media(max-width:1000px){main{grid-template-columns:1fr;height:auto}}
  .left{display:flex;flex-direction:column;min-height:0}
  .filters{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
  .filters button{font-size:11px;padding:5px 9px;border-radius:7px}
  .filters button.cur{border-color:var(--accent);color:var(--accent);background:#16313a}
  .plist{overflow-y:auto;flex:1;min-height:180px;border:1px solid var(--line);
         border-radius:10px;margin-top:8px}
  .pitem{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
  .pitem:last-child{border-bottom:0}.pitem:hover{background:var(--panel2)}
  .pitem.sel{background:#173c42;border-left:3px solid var(--accent)}
  .pitem b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pitem span{color:var(--muted);font-size:10.5px}
  .st{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  .st.done{background:#63d9a0}.st.pending{background:#4b5876}.st.failed{background:#ff7c8a}
  .right{display:flex;flex-direction:column;min-height:0;gap:10px}
  .steps{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
  .step{background:var(--panel2);border:1px solid var(--line);
        border-radius:10px;padding:8px 12px;cursor:pointer;transition:.15s;
        display:flex;align-items:center;gap:12px}
  .step .n{flex:0 0 28px}.step h4{flex:1}
  .step .d{flex:0 0 auto;min-width:120px;text-align:right}
  .step.cur{border-color:var(--accent);box-shadow:0 0 0 1px rgba(110,231,200,.2)}
  .step .n{font:10px/1 var(--mono);color:var(--muted);letter-spacing:1.5px}
  .step h4{margin:5px 0 2px;font-size:12.5px}
  .step .d{font-size:10px;color:var(--muted)}
  .scroll{overflow-y:auto;flex:1;min-height:0;padding-right:5px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:11px;
       padding:13px;margin-bottom:11px}
  .box h4{margin:0 0 9px;font-size:11px;letter-spacing:.5px;color:var(--muted);
          font-weight:500;display:flex;justify-content:space-between;align-items:center}
  .box.in{border-left:3px solid #7aa8ff}.box.out{border-left:3px solid #63d9a0}
  .box.chain{border-left:3px solid #9c8cff}.box.src{border-left:3px solid #ffb35c}
  textarea{width:100%;min-height:120px;background:#0b1224;border:1px solid var(--line);
    color:#cdd8f0;border-radius:8px;padding:10px;font:11px/1.6 var(--mono);resize:vertical}
  .btns{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
  .btns button{font-size:11px;padding:6px 10px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:5px 9px;font-size:11.5px;color:var(--muted)}
  .kv b{color:var(--text);font-weight:500;word-break:break-all}
  .edge{display:flex;align-items:center;gap:8px;font-size:11px;padding:5px 8px;
        border-radius:7px;background:#0f1729;margin-bottom:5px;flex-wrap:wrap}
  .edge .rel{font:10px/1 var(--mono);padding:3px 7px;border-radius:5px;
             color:#0b1020;font-weight:600}
  .edge .from,.edge .to{color:#cdd8f0}
  .edge .arw{color:#7d8bb0}
  .chain-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-bottom:9px}
  .chain-legend b{color:var(--text);font-weight:500}
  .chaincard{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;
             background:#0f1729;overflow:hidden}
  .chaincard summary{cursor:pointer;padding:7px 10px;font-size:11.5px;
                     display:flex;align-items:center;gap:8px;list-style:none}
  .chaincard summary::-webkit-details-marker{display:none}
  .chaincard summary .ck{font-size:9px;padding:2px 6px;border-radius:5px;
                         color:#0b1020;font-weight:600}
  .chaincard summary b{color:var(--text);font-weight:500;flex:1}
  .chaincard summary .cn{font-size:10px;color:var(--muted)}
  .chainbody{padding:2px 10px 9px}
  .edge .nd{font-size:10.5px;background:#121b30;border-radius:5px;padding:2px 7px;
            color:#cdd8f0;display:inline-flex;gap:5px;align-items:center}
  .edge .nd i{font-style:normal;font-size:9px;color:#8fa0c8}
  .edge .hintrel{font-size:10px;color:var(--muted)}
  .edge .evidence{width:100%;font-size:10px;color:#7d8bb0;margin-top:3px}
  .chain-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
  .srcitem{margin-bottom:9px}
  .srcitem h5{margin:0 0 4px;font-size:11px;color:var(--accent2)}
  .srcitem pre{max-height:190px;font-size:10.5px}
  .empty{color:var(--muted);font-size:12px;padding:12px 0}
  .msg{margin-top:8px}
</style>
</head>
<body>
<header>
  <div><h1>论文抽取</h1>
    <div class="sub">已抽取只读查看 · 未抽取可启动 · 每阶段可溯源原文并编辑输入重抽</div></div>
  <div class="crumb"><a href="/">← 主界面</a><a href="/pipeline">Pipeline</a>
    <a class="cur" href="/pipeline/extract">论文抽取</a><a href="/data">数据</a></div>
</header>
<main>
  <section class="panel left">
    <h2>论文库</h2><p class="hint" id="cnt">加载中…</p>
    <div class="filters" id="filters"></div>
    <input id="q" type="text" placeholder="搜索标题 / arXiv / 仓库" />
    <div class="plist" id="plist"></div>
    <div class="msg" id="msg" style="display:none"></div>
  </section>
  <section class="right">
    <div class="steps" id="steps"></div>
    <div class="scroll" id="scroll">
      <div class="empty">左侧选一篇论文。已抽取的直接查看结果，不会重复抽取。</div>
    </div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const EDGE_COLORS={
  HAS_SECTION:'#7aa8ff', HAS_BLOCK:'#9c8cff', HAS_STEP:'#63d9a0',
  HAS_FORMULA:'#63d9a0', USES_TOOL:'#63d9a0', REALIZED_BY:'#5fd0d8',
  HAS_MODULE_IMPL:'#5fd0d8', COMPARES_WITH:'#ffb35c', IMPROVED_BY:'#ffb35c',
  REPLACES:'#ffb35c', REPLACED_BY:'#ffb35c', BELONGS_TO:'#ffb35c',
  HAS_LIMITATION:'#ff8f6b', ADDRESSED_BY:'#ff8f6b',
  EVALUATED_ON:'#f58ac0', HAS_DATA_CONTRACT:'#f58ac0',
  REPORTS:'#f58ac0', REPORTS_VALUE:'#f58ac0', SITUATED_IN:'#ffd166',
  SOURCED_FROM:'#ffd166', RESOLVED_TO:'#ffd166'};
const EDGE_LABEL={
  HAS_SECTION:'主链小节', HAS_BLOCK:'深挖块', HAS_STEP:'算法步骤',
  HAS_FORMULA:'对应公式', USES_TOOL:'使用工具', REALIZED_BY:'代码实现',
  COMPARES_WITH:'方法对比', HAS_LIMITATION:'局限', IMPROVED_BY:'改进',
  EVALUATED_ON:'评测于基准', HAS_DATA_CONTRACT:'数据契约', REPORTS:'报告观测'};
const NODE_COLORS={
  Paper:'#6ee7c8', Section:'#7aa8ff', Block:'#9c8cff',
  Algorithm:'#63d9a0', AlgorithmStep:'#63d9a0', Formula:'#ffd166',
  Tool:'#ffb35c', CodeFunction:'#5fd0d8', CodeModule:'#5fd0d8',
  Benchmark:'#f58ac0', DataContract:'#f58ac0', Observation:'#f58ac0',
  MetricDefinition:'#f58ac0', SourcePaper:'#ff8f6b', TechTreeNode:'#ff8f6b',
  Result:'#ffd166'};
const nodeColor=t=>NODE_COLORS[t]||'#8b98bd';
const nodeTag=(t,label)=>`<span class="nd" style="border-left:3px solid ${nodeColor(t)}">
  <i>${esc(t)}</i>${esc((label||'').slice(0,38))}</span>`;
const FILTERS=[['all','全部'],['done','已抽取'],['pending','未抽取'],['failed','失败']];
const STAGE_LABEL=['小标题筛选与主链','块向量化存储','按块类型肢解','三类出处与 CSV'];
let PAPERS=[], SEL=null, FILTER='all', RUN=null, CUR=0, SRC=null, TIMER=null, JID=null;
const msg=(t,bad=false)=>{const m=$('#msg');m.style.display='block';
  m.className='msg'+(bad?' err':'');m.textContent=t;};
const color=rel=>EDGE_COLORS[rel]||'#8b98bd';
async function loadPapers(){
  const q=$('#q').value||'';
  const d=await (await fetch('/api/v7/papers?status='+FILTER+'&q='+
    encodeURIComponent(q)+'&limit=120')).json();
  PAPERS=d.items||[];
  const c=d.counts||{};
  $('#cnt').textContent=`已抽取 ${c.done||0} · 未抽取 ${c.pending||0} · 失败 ${c.failed||0} （当前显示 ${d.total}）`;
  $('#filters').innerHTML=FILTERS.map(([k,v])=>
    `<button data-f="${k}" class="${k===FILTER?'cur':''}">${v}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
    FILTER=b.dataset.f; loadPapers();});
  $('#plist').innerHTML=PAPERS.map((p,i)=>`<div class="pitem" data-i="${i}">
    <b><i class="st ${p.status}"></i>${esc(p.title||p.arxiv_id)}</b>
    <span>${esc(p.arxiv_id)} · ${p.status==='done'
      ? '已抽取 '+(p.seconds??'-')+'s · '+(p.n_blocks??0)+' 块'
      : p.status==='failed'?'抽取失败':'未抽取'}
    ${p.repo?' · '+esc(p.repo).slice(0,24):''}</span></div>`).join('')
    ||'<div class="pitem">无结果</div>';
  document.querySelectorAll('.pitem[data-i]').forEach(e=>e.onclick=()=>pick(+e.dataset.i));
  const aid=new URLSearchParams(location.search).get('aid');
  if(aid){const k=PAPERS.findIndex(p=>p.arxiv_id===aid);if(k>=0)pick(k);}
}
async function pick(i){
  SEL=PAPERS[i]; CUR=0; SRC=null; RUN=null;
  document.querySelectorAll('.pitem').forEach((e,k)=>e.classList.toggle('sel',k===i));
  if(SEL.status!=='done'){
    $('#scroll').innerHTML=`<div class="box"><h4>${SEL.status==='pending'?'尚未抽取':'抽取失败'}</h4>
      <div class="empty">${SEL.status==='failed'
        ? '上次抽取失败（多半是 Markdown 伪标题）。可尝试重跑。'
        : '该论文没有抽取产物。点击下方按钮启动（本地 qwen + polo 兜底，约 1–3 分钟）。'}</div>
      <div class="btns"><button class="primary" id="doExtract">${SEL.status==='failed'?'重新抽取':'开始抽取'}</button></div></div>`;
    $('#doExtract').onclick=startExtract;
    renderSteps(); return;
  }
  // 已抽取：只读查看，绝不重抽
  $('#scroll').innerHTML='<div class="empty">正在加载已有抽取结果…</div>';
  RUN=await (await fetch('/api/v7/run/'+SEL.arxiv_id)).json();
  renderSteps(); renderDetail();
}
async function startExtract(){
  if(!SEL)return; msg('已提交抽取任务…');
  const d=await (await fetch('/api/v6/pipeline/extract',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({arxiv_id:SEL.arxiv_id,mode:'live',use_polo:true})})).json();
  JID=d.job_id; TIMER=setInterval(async()=>{
    const s=await (await fetch('/api/v6/pipeline/extract/'+JID)).json();
    if(s.status!=='running'){clearInterval(TIMER);TIMER=null;
      msg(s.status==='done'?'抽取完成':'抽取失败：'+(s.error||''),s.status!=='done');
      await loadPapers();}
  },1500);
}
function stageCount(s){const o=s.output||{};
  if(o.n_blocks!=null)return o.n_blocks+' 块';
  if(o.summary)return Object.values(o.summary).filter(x=>typeof x==='number').join('/');
  return Object.keys(o).length+' 项';}
function renderSteps(){
  $('#steps').innerHTML=STAGE_LABEL.map((lab,i)=>`<div class="step ${i===CUR?'cur':''}" data-i="${i}">
    <span class="n">0${i+1}</span><h4>${lab}</h4>
    <span class="d">${RUN&&RUN.stages&&RUN.stages[i]
      ? ((RUN.stages[i].meta||{}).seconds??'-')+'s · '+stageCount(RUN.stages[i])
      : SEL&&SEL.status==='done'?'已抽取':'待抽取'}</span></div>`).join('');
  document.querySelectorAll('.step[data-i]').forEach(e=>e.onclick=()=>{
    CUR=+e.dataset.i; SRC=null; renderSteps(); renderDetail();});
}
const STAGE_EDGES=[
  ['HAS_SECTION'],
  ['HAS_BLOCK'],
  ['COMPARES_WITH','IMPROVED_BY','REPLACES','REPLACED_BY','BELONGS_TO',
   'HAS_LIMITATION','ADDRESSED_BY','HAS_STEP','HAS_FORMULA','USES_TOOL',
   'REALIZED_BY','HAS_MODULE_IMPL','EVALUATED_ON','HAS_DATA_CONTRACT','REPORTS'],
  ['SITUATED_IN','SOURCED_FROM','RESOLVED_TO']];
const EDITABLE={0:'stage0', 2:'stage2:related_work'};
async function sourceText(stage){
  const d=await (await fetch('/api/v7/source/'+SEL.arxiv_id+'?stage='+stage)).json();
  return (d.snippets||[]).map(s=>`## ${s.label}\n${s.text}`).join('\n\n');
}
function chainHTML(){
  const rels=new Set(STAGE_EDGES[CUR]||[]);
  const groups=((RUN.chains||{}).chains||[])
    .map(c=>({...c, edges:(c.edges||[]).filter(e=>rels.has(e.rel))}))
    .filter(c=>c.edges.length);
  if(!groups.length)return '<div class="empty">本阶段没有建立边</div>';
  const relCount={};
  groups.forEach(c=>c.edges.forEach(e=>relCount[e.rel]=(relCount[e.rel]||0)+1));
  const legend=Object.entries(relCount).map(([r,n])=>
    `<span><i style="background:${color(r)}"></i>${esc(EDGE_LABEL[r]||r)} <b>×${n}</b></span>`).join('');
  const cards=groups.map((c,gi)=>`<details class="chaincard" ${gi<3?'open':''}>
    <summary><span class="ck" style="background:${color(c.edges[0].rel)}">${esc(c.kind)}</span>
      <b>${esc(c.label)}</b><span class="cn">${c.edges.length} 条边</span></summary>
    <div class="chainbody">${c.edges.map(e=>`<div class="edge">
      <span class="rel" style="background:${color(e.rel)}">${esc(e.rel)}</span>
      <span class="hintrel">${esc(EDGE_LABEL[e.rel]||'')}</span>
      ${nodeTag(e.source_type,e.source_label)}
      <span class="arw">──→</span>
      ${nodeTag(e.target_type,e.target_label)}
      ${e.evidence?`<div class="evidence">证据：${esc(e.evidence).slice(0,90)}</div>`:''}
    </div>`).join('')}</div></details>`).join('');
  return `<div class="chain-legend">${legend}</div>${cards}`;
}
function inputHTML(s){
  const editable=EDITABLE[CUR];
  return `<div class="box in"><h4>① 输入
    <span>${editable?'可编辑 · 可重抽':'规则阶段 · 只读'}</span></h4>
    <div class="kv">${Object.entries(s.input||{}).map(([k,v])=>
      `<span>${esc(k)}</span><b>${esc(typeof v==='object'?JSON.stringify(v):v).slice(0,220)}</b>`).join('')}</div>
    <div class="btns">
      <button id="srcBtn">溯源：查看本阶段原文</button>
      ${editable?'<button class="primary" id="editBtn">编辑本阶段输入</button>':''}
    </div>
    <div id="editArea"></div></div>`;
}
function outputHTML(s){
  const o=s.output||{};
  return `<div class="box out"><h4>② 输出</h4>
    <pre>${esc(JSON.stringify(o,null,2)).slice(0,4200)}</pre></div>`;
}
function renderDetail(){
  if(!RUN||!RUN.stages||!RUN.stages[CUR]){
    $('#scroll').innerHTML='<div class="empty">该阶段暂无数据</div>';return;}
  const s=RUN.stages[CUR];
  $('#scroll').innerHTML=inputHTML(s)+outputHTML(s)+
    `<div class="box chain"><h4>③ 建立的链（按边名着色 · ${CUR+1}/4）</h4>
      ${chainHTML()}</div>`+
    (SRC?`<div class="box src"><h4>④ 原文溯源（${SRC.n_snippets} 段）</h4>
      ${SRC.snippets.map(x=>`<div class="srcitem"><h5>${esc(x.label)}</h5>
        <pre>${esc(x.text)}</pre></div>`).join('')}</div>`:'');
  $('#srcBtn').onclick=async()=>{
    SRC=SRC||await (await fetch('/api/v7/source/'+SEL.arxiv_id+
      '?stage=stage'+CUR)).json();
    renderDetail();};
  if($('#editBtn'))$('#editBtn').onclick=()=>openEditor(s);
}
async function openEditor(s){
  const kind=EDITABLE[CUR];
  let text='';
  try{ text=await sourceText('stage'+CUR); }catch(e){ text=JSON.stringify(s.input,null,2); }
  const modules=['related_work','method','benchmark_profile','benchmark_values'];
  const sel=CUR===2?`<select id="modSel">${modules.map(m=>
    `<option value="${m}">${m}</option>`).join('')}</select>`:'';
  $('#editArea').innerHTML=`<div style="margin-top:10px">
    <div class="hint">编辑下方输入后重抽${CUR===2?'（选择要重跑的模块）':'（重新筛选小标题）'}</div>
    ${sel}<textarea id="inp">${esc(text)}</textarea>
    <div class="btns"><button class="primary" id="rerunBtn">用此输入重新抽取</button>
      <button id="cancelBtn">取消</button></div></div>`;
  $('#cancelBtn').onclick=()=>{$('#editArea').innerHTML='';};
  $('#rerunBtn').onclick=async()=>{
    const stage=CUR===0?'stage0':('stage2:'+$('#modSel').value);
    const d=await (await fetch('/api/v7/rerun',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({arxiv_id:SEL.arxiv_id,stage:stage,
        input_text:$('#inp').value,use_polo:true})})).json();
    msg(d.ok?('重抽完成 · '+(d.seconds??'-')+'s · '+JSON.stringify(d).slice(0,90))
      :('重抽失败：'+(d.detail||'未知')),!d.ok);
    if(d.ok){RUN=await (await fetch('/api/v7/run/'+SEL.arxiv_id)).json();
      renderSteps();renderDetail();}
  };
}
$('#q').oninput=()=>loadPapers();
loadPapers();
</script>
</body></html>
