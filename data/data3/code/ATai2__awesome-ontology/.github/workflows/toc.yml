name: Update TOC

on:
  workflow_dispatch:

jobs:
  toc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate table of contents
        run: python scripts/generate_toc.py

      - name: Open pull request if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: regenerate table of contents"
          title: "docs: regenerate table of contents"
          body: Automatically generated by the Update TOC workflow.
          branch: chore/regenerate-toc
