name: Awesome Lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run awesome-lint
        run: npx --yes awesome-lint

      - name: Check table of contents
        run: python scripts/generate_toc.py --check

      - name: Collect list statistics
        run: python scripts/stats.py
