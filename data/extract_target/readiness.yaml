version: 1
phases:
  P0:
    critical:
    - method_limits
    any_of:
    - - formal_def
    - - old_forms
    optional:
    - formal_def
    - old_forms
    补抽: R7_formulation
  P1:
    critical:
    - arch_modules
    - key_challenge
    any_of:
    - - why_not_other
    - - arch_modules
    补抽: R8_architecture
  P2:
    critical:
    - data_sources
    any_of:
    - - dedup_rule
    - - split_spec
    补抽: R9_dataset
  P6:
    critical:
    - result_tables
    optional:
    - hyperparams
    补抽: R10_result_table
  P7:
    critical:
    - arch_modules
    any_of:
    - - hyperparams
    - - ablation_hyperparams
    补抽: R8_architecture
na_rules:
  data_sources:
    any: &id001
    - field: paradigm
      in:
      - formal
      - interpretive
    - field: abstract
      contains_any:
      - zero-shot
      - without training
      - no training data
    - field: true_title
      contains_any:
      - survey
      - review
      - taxonomy
  dedup_rule:
    any: *id001
  split_spec:
    any: *id001
  hyperparams:
    any: *id001
  ablation_hyperparams:
    any: *id001
