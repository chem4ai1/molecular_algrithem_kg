stage: E1_paper
order: 1
enabled: true
target:
  classes:
  - Paper
  wrapper: null
  target_desc: Paper
contract:
  required:
  - research_question
  - problem_category
  - why_hard
  optional:
  - relation_hints
  - evidence
  note: research_question 与 problem_category 是 Paper 的字符串属性，不建节点。
  all_fields:
  - research_question
  - problem_category
  - domain_code
  - why_hard
  - relation_hints
  - evidence
  aux_fields:
  - domain_code
  - evidence
section_slice: paper
slots:
- paper_text
- rule_hints
template: "任务：抽 Paper 的核心属性（研究什么问题 / 问题类别 / 瓶颈 / 关系线索）。\n输出 JSON：\n{\"research_question\":\"一句话说清本文研究什么问题（含输入、目标、约束）\"\
  ,\n  \"problem_category\":\"从 TASK_TYPES 词表里选一个，没有就空\",\n  \"domain_code\":\"D0..D10，不确定留空（后续由规则校准）\"\
  ,\n  \"why_hard\":\"现有方法的瓶颈 1 句\",\n  \"relation_hints\":{\"related_papers\":[\"相关方法/文献名\"],\n     \
  \               \"algorithms\":[\"本文提到的算法名\"],\n                    \"benchmarks\":[\"本文提到的数据集/基准名\"\
  ]},\n  \"evidence\":{\"research_question\":\"逐字引文\",\"why_hard\":\"逐字引文\"}}\n注意：research_question 与\
  \ problem_category 是**字符串**，不是数组、不建节点。\n【论文标题】{title}\n【规则层候选信号（problem_category 只能从这里选）】\n{rule_hints}\n\
  【摘要与引言】\n{paper_text}\n"
