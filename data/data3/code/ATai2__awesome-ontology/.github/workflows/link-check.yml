name: Link Check

on:
  schedule:
    # 每周一 03:17 UTC 全量检查一次
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "README.md"
      - "scripts/check_links.py"
      - "scripts/ignore-links.txt"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check links
        # 构建期失败不阻塞合并，结果以报告形式归档
        continue-on-error: true
        run: python scripts/check_links.py --workers 24 --timeout 25 --json reports/links.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: reports/links.json
          if-no-files-found: ignore
