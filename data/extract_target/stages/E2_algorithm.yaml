stage: E2_algorithm
order: 2
enabled: true
target:
  classes:
  - Algorithm
  - AlgorithmModule
  wrapper: null
  target_desc: Algorithm + AlgorithmModule
contract:
  required:
  - name
  - mechanism
  optional:
  - task_type
  - problems_solved
  - why_it_works
  - applicable_to
  - limitations
  - modules
  note: code_symbols 只能从【代码符号清单】选；flow_family 由规则判定。
  all_fields:
  - name
  - task_type
  - problems_solved
  - mechanism
  - why_it_works
  - applicable_to
  - limitations
  - modules
  - assumptions
  - novelty_basis
  - is_novel_component
  - component_role
section_slice: algorithm
slots:
- code_symbols
- paper_text
template: "任务：抽 Algorithm 及它的 AlgorithmModule（算法模块）。\n输出 JSON：\n{\"algorithms\":[{\"name\":\"算法名\",\n\
  \  \"task_type\":\"从 TASK_TYPES 选一个\",\n  \"problems_solved\":[\"能解决什么问题，最多 3 句\"],\n  \"mechanism\"\
  :\"机理 1-2 句（怎么做）\",\n  \"why_it_works\":\"为什么有效，可空\",\n  \"applicable_to\":[\"适用场景\"],\n  \"limitations\"\
  :[\"作者明确指出的局限\"],\n  \"modules\":[{\"name\":\"模块名\",\"mechanism\":\"动宾短语\",\n    \"formula\":\"原文公式片段或空\"\
  ,\"inputs\":\"输入\",\"outputs\":\"输出\",\n    \"code_symbols\":[\"只能从代码符号清单选\"],\n    \"tools\":[\"方法节真实出现的工具/库/力场\"\
  ]}]}]}\n规则：\n1. modules 3-6 个，按方法逻辑顺序；mechanism 用动宾短语，不照抄标题。\n2. code_symbols 只能从【代码符号清单】选，禁止发明函数/类。\n\
  3. tools 只写方法节真实出现的；formula 必须是原文片段。\n4. flow_family（算法族）不由你判定，规则层会算。\n【方法节】\n{paper_text}\n【代码符号清单】\n\
  {code_symbols}\n每个模块补充（消融与前提检查用）：\n  \"is_novel_component\":true|false,      // 是否论文明确声称的新组件\n  \"component_role\"\
  :\"backbone|encoder|decoder|loss|sampler|other\"\n算法级补充：\n  \"assumptions\":[\"该方法成立所依赖的前提\"],   //\
  \ 不是局限，是前提\n  \"novelty_basis\":[\"technical_constraint|theoretical_blind_spot|data_availability\"]\n\
  注意：不要把所有模块都标 is_novel_component=true；assumptions 只写原文明确说出的。"
