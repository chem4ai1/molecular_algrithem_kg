stage: E1_paper
order: 1
enabled: true
target:
  classes:
  - Paper
  wrapper: null
  target_desc: Paper
contract:
  required:
  - research_question
  - problem_category
  - why_hard
  optional:
  - relation_hints
  - evidence
  note: research_question 与 problem_category 是 Paper 的字符串属性，不建节点。
  all_fields:
  - research_question
  - problem_category
  - why_hard
  - relation_hints
  - paradigm
  - evidence_type
  - evidence_norm
  - section_map
  - writing_style
  - claims
  - gaps
  - delta_claims
  - method_limits
  - old_forms
  aux_fields:
  - domain_code
  - evidence
section_slice: paper
slots:
- paper_text
- rule_hints
template: "【论文标题】{title}\n【摘要与引言】\n{paper_text}\n\n任务：从上面正文抽取字段。只输出纯 JSON，不要代码块、不要解释。\n\n必填：\n  \"research_question\"\
  :\"1-2句完整研究问题（40-90字）：必须包含研究对象/目标、本文方法或干预、关键矛盾或限制；不要只写短标题\",\n  \"problem_category\":\"问题类别（从词表选）\"\
  ,\n  \"why_hard\":\"现有方法为什么做不到（1-2句，指出具体限制，不要泛泛而谈）\"\n可选：\n  \"relation_hints\":{},\n  \"paradigm\"\
  :\"formal|empirical|design|interpretive\",\n  \"evidence_type\":\"causal_inference|derivational|experimental|simulational|correlational|interpretive\"\
  ,\n  \"evidence_norm\":[\"该领域认可的指标/证据形式\"],\n  \"section_map\":[{\"section\":\"节名\",\"claims\":[\"该节论断\"\
  ]}],\n  \"writing_style\":\"写作惯例（简短）\",\n  \"claims\":[{\"statement\":\"作者主张（≤80字）\",\"evidence\":\"\
  逐字引文\"}],\n  \"gaps\":[{\"gap_type\":\"capability|scale|data|theory|efficiency\",\"statement\":\"空白\"\
  ,\"evidence\":\"引文\"}],\n  \"delta_claims\":[{\"statement\":\"声称的增量\",\"baseline\":\"被改进方法\",\"evidence\"\
  :\"引文\"}],\n  \"old_forms\":[\"先前工作怎么做的（原文写法）\"],\n  \"method_limits\":[\"作者指出的旧方法具体缺陷\"]\n不输出：authors/abstract/data_sources/dedup_rule/formal_def/hyperparams/result_tables/figures/references/negative_results/open_problems（由规则层负责）。"
rules:
  preprocess: normalize_pdf
  data_sources:
    type: db_names
    candidates:
    - ZINC
    - ChEMBL
    - PubChem
    - Enamine
    - USPTO
    - GEOM
    - QM9
    - GuacaMol
    - MoleculeNet
    - CrossDocked
    - BindingDB
    - PDB
    - ChemCoTBench
    - SIDER
    - Tox21
    - FreeSolv
    - Lipophilicity
    - Wikipedia
    - Wikidata
    - DBpedia
    - YAGO
    - Freebase
    - SNOMED CT
    - Gene Ontology
    - GO
    - UMLS
    - OAE
    - Biolink
    - BioPortal
    - OWL
    - RDF
    - LUBM
    - MUTAG
    - Cora
    - Citeseer
  dedup_rule:
    type: regex
    group: 0
    max_chars: 120
    patterns:
    - Tanimoto[^.]{0,120}?([01]\.\d+)
    - ([01]\.\d+)[^.]{0,40}?Tanimoto
    - sequence identity[^.]{0,40}?([0-9]{2}\s*%)
    - scaffold split
  split_spec:
    type: regex
    group: 0
    max_chars: 80
    patterns:
    - (?:split|ratio)[^.]{0,40}?(\d{1,3})\s*[/:：\-]\s*(\d{1,2})\s*[/:：\-]\s*(\d{1,2})
    - (?:training|train)[^.]{0,40}?(\d{1,3})\s*%
    - split[^.]{0,50}?(\d{1,3})\s*[,/]\s*(\d{1,3})
    - (?:train|training)\\s*/\\s*(?:dev|valid(?:ation)?)\\s*/\\s*test
    - (?:train|training)[^.]{0,50}?(?:dev|valid(?:ation)?)[^.]{0,50}?test
    - (?:train|test|validation)\\s+splits?
  hyperparams:
    type: hyperparam_list
    max_items: 6
  result_tables:
    type: md_tables
    max_tables: 3
    max_rows: 30
    main_table_first_col_keywords:
    - model
    - method
    - approach
    - system
    - baseline
    - variant
    - ours
    main_table_min_rows: 2
  formal_def:
    type: regex
    group: 0
    max_chars: 160
    patterns:
    - ([A-Za-z_]{1,6}\s*=\s*[A-Za-z_]{1,8}\s*\(\s*[A-Za-z_]{1,8}\s*,[^)]{0,40}\))
    - ((?:M|Y|X|y|x)\s*=\s*[A-Za-z_]{1,8}\s*\([^)]{1,60}\))
  figures:
    type: md_figures
    max_items: 12
